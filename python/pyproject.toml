[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatialscape"
dynamic = ["version"]
description = "Build static spatialscape viewer bundles from AnnData / SpatialData"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Michael Totty", email = "mictott@gmail.com" }]
keywords = ["spatial-transcriptomics", "visium", "xenium", "single-cell", "visualization", "zarr", "deck.gl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Visualization",
  "Environment :: Web Environment",
]
dependencies = [
  "anndata>=0.12",
  "zarr>=3.0",
  "numcodecs>=0.15",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pyarrow>=15",
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6",
  "imageio>=2.34",
  "tifffile>=2024.1",
  "scikit-image>=0.22",
  "pillow>=10",
  "rds2py>=0.10",
]

[project.urls]
Homepage = "https://mictott.github.io/spatialscape/"
Documentation = "https://mictott.github.io/spatialscape/docs/"
Repository = "https://github.com/mictott/spatialscape"
Issues = "https://github.com/mictott/spatialscape/issues"
Changelog = "https://github.com/mictott/spatialscape/blob/main/CHANGELOG.md"

[project.optional-dependencies]
spatialdata = ["spatialdata>=0.4"]
dev = ["pytest>=8", "ruff>=0.5", "h5py>=3.10", "build>=1.2"]

[project.scripts]
spatialscape = "spatialscape.cli:main"
sscape = "spatialscape.cli:main"

[tool.hatch.version]
path = "src/spatialscape/__init__.py"

[tool.hatch.build]
# the viewer build is generated (python/scripts/bundle_app.py) and gitignored, so list it explicitly
artifacts = ["src/spatialscape/_app/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/spatialscape"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PIE", "C4", "RUF"]
ignore = ["E501", "B008", "SIM108", "RUF012", "RUF005"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
