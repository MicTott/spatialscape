# Human habenula snMultiome (Montgomery et al. 2026, bioRxiv 10.64898/2026.09.30.755667). The public cell-level Seurat
# object (spatialLIBD::fetch_data("habenula_atlas_snMultiome_seurat_cell"), 4.9 GB) is read straight from the .rds:
# the RNA `data` layer as expression, the 354k ATAC peaks as `peak: ` features, meta.data as annotations.
# Download it once into examples/habenula-src/ (gitignored); conversion takes ~3 minutes and ~40 GB of RAM.
id: habenula_multiome
name: Human habenula atlas
description: "Montgomery et al. 2026: snMultiome of 54,193 nuclei from 10 donors (RNA + ATAC in the same nuclei, on the WNN UMAP, with chromatin accessibility tracks per cell type), Visium HD at cell level (287,325 cells, 5 donors, 10 sections) and Visium (12 capture areas, 3 donors, 4 anterior-posterior levels)."
default_gene: GPR151
default_color: { field: cluster_mid }
layout: { mode: grid }
thumbnail_sample: hd_Br9090_1

feature_groups:
  - { id: peaks, name: Peaks (ATAC), pattern: "^peak: ", units: TF-IDF }

fields:
  - { id: celltype, name: Cell type, type: categorical }
  - { id: cluster_mid, name: Cell type (mid), type: categorical }      # shared by the snMultiome mid clusters and the Visium HD cell types
  - { id: cluster_fine, name: Cluster (fine), type: categorical }
  - { id: donor, name: Donor (run), type: categorical }
  - { id: doublet, name: scDblFinder class, type: categorical }
  - { id: total_counts, name: RNA UMIs, type: continuous }
  - { id: detected_genes, name: Detected genes, type: continuous }
  - { id: mito_percent, name: Mito %, type: continuous }
  - { id: atac_fragments, name: ATAC fragments, type: continuous }
  - { id: tss_enrichment, name: TSS enrichment, type: continuous }
  - { id: nucleosome_signal, name: Nucleosome signal, type: continuous }
  - { id: rna_weight, name: RNA weight (WNN), type: continuous }
  - { id: domain, name: "Domain (Visium, SNN k=9)", type: categorical }
  - { id: level, name: A-P level, type: categorical }
  - { id: hd_ficture, name: FICTURE cluster (HD), type: categorical }
  - { id: hd_banksy, name: BANKSY cluster (HD), type: categorical }

samples:
  - path: habenula-src/seur_cell_snMultiome_habenula_atlas.rds
    platform: snrnaseq
    assay: data                      # Seurat layer of the RNA assay; also: counts
    embedding: wnn_umap              # also: rna_umap_harmony, atac_umap_harmony
    id: wnn
    name: WNN UMAP (RNA + ATAC)
    group: snMultiome
    fields:
      celltype: ident
      cluster_mid: mid_cluster
      cluster_fine: fine_cluster
      donor: orig.ident
      doublet: scDblFinder.class
      total_counts: nCount_RNA
      detected_genes: nFeature_RNA
      mito_percent: percent.mt
      atac_fragments: atac_fragments
      tss_enrichment: TSS.enrichment
      nucleosome_signal: nucleosome_signal
      rna_weight: RNA.weight
    tracks:                                   # accessibility per cell type, pooled over the runs listed here
      fragments:                              # Cell Ranger ARC fragment files, streamed from the cluster (nothing stored locally); export JHPCE_USER=<login>
                                              # eight more runs (4S, 5S, S3, S7, S8, S9, S10, S12) can be added the same way
        6S_Hb_KDM: ssh://${JHPCE_USER}@jhpce-transfer01.jhsph.edu/dcs04/lieber/lcolladotor/Habenula_R01_LIBD4270/Hb_multiome/processed-data/cellrangerARC/6S_Hb_KDM/outs/atac_fragments.tsv.gz
        S11_Hb_KDM: ssh://${JHPCE_USER}@jhpce-transfer01.jhsph.edu/dcs04/lieber/lcolladotor/Habenula_R01_LIBD4270/Hb_multiome/processed-data/cellrangerARC/S11_Hb_KDM/outs/atac_fragments.tsv.gz
      sample_column: fragment_run             # both columns come from the Fragment records inside the Seurat object
      barcode_column: fragment_barcode
      by: [celltype, donor]                   # one track set per cell type (pooled over the runs) and one per donor
      bin: 100                                # 100 bp tiles (ArchR's default); 25 bp made 3.4 GB of bigWigs for two runs
      normalize: tss                          # scale each group by its insertions at gene TSSs (ArchR's ReadsInTSS), not by all insertions
      genome: hg38
      genes: ~/Library/Caches/org.R-project.R/R/BiocFileCache/e7c024baa500_gencode.v32.annotation.gtf.gz   # the Cell Ranger ARC 2020-A annotation

  # Visium HD, cell level (bin2cell segmentation), five donors with two sections each. spatialCoords are full-resolution
  # pixels; SpaceRanger's microns_per_pixel is not in the object, 0.2525 is LIBD's usual value for these 40x scans
  # (confirm against binned_outputs/square_002um/spatial/scalefactors_json.json). Only the lowres H&E travels in the object.
  - path: habenula-src/spe_cell_habenula_atlas.rds
    platform: visium_hd
    assay: logcounts
    sample_col: sample_id
    microns: { microns_per_unit: 0.2525 }
    id: "hd_{name}"
    name: "{name} (Visium HD)"
    group: "{name}"
    fields:
      cluster_mid: cell_type
      hd_ficture: ficture_cluster
      hd_banksy: banksy_cluster
      donor: sample_id

  # Visium (spot level): three donors across four anterior-posterior levels of the habenula.
  - path: habenula-src/spe_visium_habenula_atlas.rds
    platform: visium
    assay: logcounts
    sample_col: sample_id
    id: "vis_{name}"
    name: "{name} (Visium)"
    group: "{name}"
    fields:
      domain: SNN_k10_k9
      donor: brain_id
      level: brain_area
      total_counts: sum_umi
      detected_genes: sum_gene
      mito_percent: { column: expr_chrM_ratio, scale: 100 }
