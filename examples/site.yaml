# The LIBD gallery. `spatialscape site build examples/site.yaml -o <dir>` writes the viewer and the registry; the
# bundles live in the S3 bucket behind data_url (uploaded with `aws s3 sync examples/<name> s3://<bucket>/<id>`).
title: LIBD spatial data browser
intro: Spatial transcriptomics and snRNA-seq datasets from the Lieber Institute for Brain Development, viewable in the browser without any installation.
nav:
  title: spatialscape
  logo: favicon.svg
  links:
    - { label: Docs, url: https://mictott.github.io/spatialscape/docs/ }
    - { label: GitHub, url: https://github.com/MicTott/spatialscape }
data_url: https://d1zhz42bsrntt0.cloudfront.net      # S3 bucket behind CloudFront; the site carries only the viewer and the registry
datasets:
  - bundle: amygdala
    # paper: { title: Totty et al., url: https://doi.org/... }
    tags: [amygdala, visium, visium-hd, xenium, snrnaseq]
  - bundle: dacc
    # paper: { title: ..., url: https://doi.org/... }
    tags: [dACC, cortex, layers, visium, snrnaseq]
  - bundle: bla
    # paper: { title: Totty et al. 2024, url: https://doi.org/... }
    tags: [amygdala, cross-species, snrnaseq]
