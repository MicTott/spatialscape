# Human amygdala (LIBD): Xenium + Visium sections and an snRNA-seq reference.
# Inputs are the read-only AnnData-zarr stores exported for the earlier Vitessce app; nothing there is modified.
id: amygdala
name: Human amygdala
description: Visium, Visium HD and Xenium sections of human amygdala with spatial domains and cell types.
default_gene: PENK
default_color: { field: domain }
palette: /Users/michael.totty/Documents/R/spatialAmygdala/Vitessce_app/build/handoff/palette.json
layout: { mode: grid }

feature_groups:
  - { id: rctd, name: Cell type weights (RCTD), pattern: "^RCTD: ", units: weight }

# Only fields that need a display name, palette key, alias or explicit order are declared here;
# anything else a sample maps is declared automatically with its type inferred from the data.
fields:
  - { id: domain, name: Spatial domain, type: categorical, palette_key: "visium_semisupervised,xenium_banksy_domain,visium_hd_domain,domain", aliases: { AI: IA } }
  - { id: celltype_xenium, name: Cell type, type: categorical, palette_key: cell_type }
  - { id: broad_xenium, name: Broad class, type: categorical, palette_key: broad_class }
  - { id: total_counts, name: Total transcripts, type: continuous }
  - { id: nucleus_area, name: Nucleus area (µm²), type: continuous }
  - { id: total_umi, name: Total UMI (Visium), type: continuous }
  - { id: detected_genes, name: Detected genes, type: continuous }
  - { id: mito_ratio, name: Mito ratio, type: continuous }

# Per-platform defaults; every sample of that platform inherits them (sample keys override).
platforms:
  xenium:
    fields: { domain: Banksy_domains, celltype_xenium: first_type, broad_xenium: first_type_broad, total_counts: total_counts, nucleus_area: nucleus_area }
    images: []            # no morphology images in this export
  visium:
    fields: { domain: BS_k16_Semisupervised_wAI, total_umi: sum_umi, detected_genes: sum_gene, mito_ratio: expr_chrM_ratio }
    images: auto          # picks up image.ome.zarr next to each adata.zarr

# Glob entries expand to one sample per match; {name} is the matched folder name.
samples:
  - glob: /Users/michael.totty/Documents/R/spatialAmygdala/Vitessce_app/vitessce_bundle/data/xenium/Br*/adata.zarr
    platform: xenium
    id: "xen_{name}"
    name: "{name} (Xenium)"
    group: "{name}"
  - glob: /Users/michael.totty/Documents/R/spatialAmygdala/Vitessce_app/vitessce_bundle/data/visium/Br*/adata.zarr
    platform: visium
    id: "vis_{name}"
    name: "{name} (Visium)"
    group: "{name}"
  - id: sn_amy
    name: snRNA-seq (BLA, 5 donors)
    platform: snrnaseq
    kind: embedding
    group: snRNA-seq
    path: /Users/michael.totty/Documents/Web/spatialscape/examples/amygdala-src/sce_amy_human.h5ad
    coords: obsm/X_umap
    extent: 5000
    expression: { layer: X, normalized: lognorm }
    fields: { celltype_xenium: fine_celltype, broad_xenium: broad_celltype, total_umi: sum, detected_genes: detected }

# Visium HD crops (Br8325_CeA, Br8325_MeA, Br9280_CeA, Br9280_ITC, Br9280_MeA) are not built yet:
# obsm/spatial is in level-0 pixels of the cropped hires H&E and the SpaceRanger microns_per_pixel is
# not in the repo. To add them, set microns_per_unit = microns_per_pixel / scale_factor per crop
# (scale factors: Br9280_CeA 0.10383, Br8325_MeA 0.05848, Br8325_CeA 0.06173, Br9280_ITC 0.08843, Br9280_MeA 0.07726):
#  - glob: /Users/michael.totty/Documents/R/spatialAmygdala/Vitessce_app/vitessce_bundle/data/visium_hd/*/adata.zarr
#    platform: visium_hd
#    id: "hd_{name}"
#    name: "{name} (Visium HD)"
#    microns: { microns_per_unit: <fill in> }
#    fields: { domain: spatial_domain, celltype_hd: first_type, total_umi: sum, detected_genes: detected }
