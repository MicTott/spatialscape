name: release
on:
  push:
    tags: ["v*"]
permissions: { contents: write, id-token: write }
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build python --outdir dist
      - name: Publish to PyPI (trusted publishing; configure the publisher at pypi.org for mictott/spatialscape, workflow release.yml, environment pypi)
        uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v3
        with: { files: dist/*, generate_release_notes: true }
