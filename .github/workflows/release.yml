name: release
on:
  push:
    tags: ["v*"]
permissions: { contents: write, id-token: write }
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Build the viewer and copy it into the package
        run: npm ci && npm run build && python python/scripts/bundle_app.py
      - run: pip install build && python -m build python --outdir dist
      - name: The wheel must carry the viewer
        run: python -c "import zipfile,glob; w=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); assert any(n.endswith('_app/index.html') for n in w.namelist()), 'viewer missing from wheel'"
      - name: Publish to PyPI (trusted publishing; configure the publisher at pypi.org for mictott/spatialscape, workflow release.yml, environment pypi)
        uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v3
        with: { files: dist/*, generate_release_notes: true }
