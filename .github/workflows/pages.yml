name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npm test
      - run: pip install -e python
      - run: python python/scripts/gen_cli_docs.py
      - name: Rebuild the synthetic demo bundle (unsharded for GitHub Pages)
        run: |
          spatialscape synth /tmp/synth
          spatialscape build /tmp/synth/dataset.yaml -o /tmp/site/examples/synthetic --no-shard
      - run: npm run build
      - run: npm run docs:build && mkdir -p /tmp/site/docs && cp -r docs/.vitepress/dist/* /tmp/site/docs/
      - run: cp -r app/dist/* /tmp/site/
      - name: The examples gallery at /examples/ (the viewer with its card list; the synthetic bundle sits beside it)
        run: cp -r app/dist/* /tmp/site/examples/
      - name: The site root is the hosted viewer alone (no cards, so it shows the open-any-bundle box)
        run: cp .github/pages-root.json /tmp/site/datasets.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: /tmp/site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
